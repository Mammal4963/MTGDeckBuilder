<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Deck Seeker</title>
<style>
  :root {
    --surface-1: #1a1a19; --surface-2: #242422; --surface-3: #2e2d2a;
    --text-primary: #ffffff; --text-secondary: #c3c2b7;
    --border: #3c3b36; --accent: #d4b85a;
    --bar: #8a7b3d; --bar-track: #35301f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-1); color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 1.1rem 1.25rem 0.4rem; max-width: 62rem; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.35rem; }
  header p { margin: 0.3rem 0 0; color: var(--text-secondary); font-size: 0.9rem; }
  header a { color: var(--text-secondary); }
  main { max-width: 62rem; margin: 0 auto; padding: 0.75rem 1.25rem 3rem; }
  .controls { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center;
    margin: 0.6rem 0 0.8rem; }
  input[type=search], select, button {
    background: var(--surface-2); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 0.45rem 0.6rem; font-size: 0.95rem; }
  input[type=search] { flex: 1 1 16rem; }
  label.chk { color: var(--text-secondary); font-size: 0.85rem;
    display: flex; gap: 0.35rem; align-items: center; }
  #picks { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.6rem 0; }
  .pick {
    display: inline-flex; align-items: center; gap: 0.45rem;
    background: var(--surface-3); border: 1px solid var(--accent);
    border-radius: 999px; padding: 0.28rem 0.5rem 0.28rem 0.8rem;
    font-size: 0.92rem; }
  .pick button { border: none; background: none; color: var(--text-secondary);
    cursor: pointer; font-size: 1rem; padding: 0 0.2rem; }
  .pick button:hover { color: var(--text-primary); }
  #suggest-list { margin-top: 0.4rem; }
  .row {
    display: grid;
    grid-template-columns: 2.2rem 1fr 9rem 3rem;
    gap: 0.7rem; align-items: center;
    padding: 0.4rem 0.6rem; border-radius: 8px; cursor: pointer;
  }
  .row:hover { background: var(--surface-2); }
  .row .rank { color: var(--text-secondary); font-size: 0.8rem; text-align: right; }
  .row .name { font-weight: 600; }
  .row .name .why, .row .name .badge {
    font-weight: 400; color: var(--text-secondary); font-size: 0.78rem; }
  .row .name .badge { color: var(--accent); }
  .row .type { color: var(--text-secondary); font-size: 0.8rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .bar-track { grid-column: auto; background: var(--bar-track);
    height: 0.5rem; border-radius: 4px; overflow: hidden; }
  .row .bar { background: var(--bar); height: 100%; }
  .row .sc { color: var(--text-secondary); font-size: 0.78rem;
    font-variant-numeric: tabular-nums; text-align: right; }
  #search-results { margin: 0.3rem 0 0.6rem; }
  #search-results .row { grid-template-columns: 1fr 12rem; }
  .muted { color: var(--text-secondary); font-size: 0.88rem; }
  .starters { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.5rem; }
  .starters button { border-radius: 999px; font-size: 0.88rem; }
  #build { background: var(--accent); color: #221d0e; border-color: var(--accent); font-weight: 600; }
  #deck-out { margin-top: 1rem; border: 1px solid var(--border); border-radius: 10px;
    padding: 0.9rem 1.1rem; }
  #deck-out h2 { margin: 0 0 0.2rem; font-size: 1.05rem; }
  #deck-out .cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem,1fr));
    gap: 0.2rem 1.4rem; margin-top: 0.5rem; }
  #deck-out .dline { display: flex; gap: 0.5rem; font-size: 0.92rem; padding: 0.1rem 0; }
  #deck-out .dline .q { color: var(--text-secondary); min-width: 1.1em; text-align: right; }
  #deck-out .dline .nm { cursor: pointer; }
  #deck-out .dline .nm:hover { color: var(--accent); }
  #deck-out .toolbar { display: flex; gap: 0.6rem; margin: 0.6rem 0 0.2rem; }
</style>
</head>
<body>
<header>
  <h1>Deck Seeker</h1>
  <p>Pick a card you want to build around — the pool collapses to cards that
     belong in the same deck, learned from tournament decklists. Keep picking;
     it keeps collapsing. <a href="/">card map</a> · <a href="deck-map.html">deck map</a></p>
</header>
<main>
  <div class="controls">
    <input id="search" type="search" placeholder="find a card to add… e.g. Blood Artist">
    <select id="source" title="which decks the synergy model learned from">
      <option value="60">learned from 60-card decks</option>
      <option value="cmd">learned from Commander decks</option>
    </select>
    <select id="format">
      <option value="">any format</option>
    </select>
    <label class="chk"><input id="incolors" type="checkbox" checked>
      stay in picked colors</label>
    <label class="chk"><input id="proven" type="checkbox">
      played cards only</label>
    <button id="build" class="primary" title="Generate a complete 60-card deck from your picks">Build full deck</button>
    <button id="clear">Clear</button>
  </div>
  <div id="search-results"></div>
  <div id="picks"></div>
  <div id="deck-out" hidden></div>
  <div id="suggestions">
    <p class="muted" id="empty-hint">Nothing picked yet. Search for a card above, or
      start from a classic:</p>
    <div class="starters" id="starters"></div>
    <div id="suggest-list"></div>
  </div>
</main>

<script>
const DATA = __DATA__;
const N = DATA.names.length;
const DIM = DATA.dim;

/* decode int8 vectors + per-card norms, one set per learned space */
function decode(b64){
  const raw = atob(b64);
  const vecs = new Int8Array(N*DIM);
  for (let i=0;i<raw.length;i++) vecs[i] = (raw.charCodeAt(i)<<24)>>24;
  const norms = new Float32Array(N);
  for (let i=0;i<N;i++){
    let s=0; const o=i*DIM;
    for (let d=0;d<DIM;d++) s += vecs[o+d]*vecs[o+d];
    norms[i] = Math.sqrt(s)||1;
  }
  return {vecs, norms};
}
const SPACES = {
  "60":  {...decode("__VECS60__"), freq: DATA.freq60},
  "cmd": {...decode("__VECSCMD__"), freq: DATA.freqcmd},
};
let source = "60";
let V = SPACES["60"].vecs, NORM = SPACES["60"].norms, FREQ = SPACES["60"].freq;
const dot=(a,b)=>{let s=0;const oa=a*DIM,ob=b*DIM;
  for(let d=0;d<DIM;d++)s+=V[oa+d]*V[ob+d];return s;};
const cos=(a,b)=>dot(a,b)/(NORM[a]*NORM[b]);

const nameIndex = new Map();
DATA.names.forEach((n,i)=>nameIndex.set(n.toLowerCase(),i));

const picks = [];
const $ = id=>document.getElementById(id);

const fmtSelect=$("format");
DATA.formats.forEach(f=>{const o=document.createElement("option");
  o.value=f;o.textContent=f;fmtSelect.appendChild(o);});

const STARTERS=["Blood Artist","Krenko, Mob Boss","Guttersnipe","Ajani's Pridemate",
  "Counterspell","Lightning Bolt","Skirk Prospector"];
STARTERS.forEach(n=>{
  if(!nameIndex.has(n.toLowerCase()))return;
  const b=document.createElement("button");
  b.textContent=n; b.onclick=()=>addPick(nameIndex.get(n.toLowerCase()));
  $("starters").appendChild(b);
});

const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const scry=n=>"https://scryfall.com/search?q="+encodeURIComponent('!"'+n+'"');

function addPick(i){
  if (!picks.includes(i)) picks.push(i);
  $("search").value=""; renderSearch(); render();
}
function removePick(i){
  picks.splice(picks.indexOf(i),1); render();
}

function candidateOk(i, colorMask, fmtBit){
  if (picks.includes(i)) return false;
  if (DATA.colors[i] & 32) return false;              /* lands out of ranking */
  if (source==="cmd" && !(DATA.legal[i] & DATA.commanderBit)) return false;
  if (source!=="cmd" && fmtBit && !(DATA.legal[i] & fmtBit)) return false;
  if ($("incolors").checked && picks.length &&
      (DATA.colors[i] & ~32 & ~colorMask)) return false;
  if ($("proven").checked && !FREQ[i]) return false;
  return true;
}

function render(){
  $("picks").innerHTML = picks.map(i=>`
    <span class="pick">${esc(DATA.names[i])}
      <button data-i="${i}" aria-label="remove">×</button></span>`).join("");
  document.querySelectorAll("#picks button").forEach(b=>
    b.onclick=()=>removePick(Number(b.dataset.i)));
  $("empty-hint").style.display = picks.length? "none":"";
  $("starters").style.display = picks.length? "none":"";
  if (!picks.length){ $("suggest-list").innerHTML=""; return; }

  const fmtBit = fmtSelect.value ?
    (1 << DATA.formats.indexOf(fmtSelect.value)) : 0;
  let colorMask=0;
  for (const p of picks) colorMask |= (DATA.colors[p] & ~32);

  const scores=[];
  for (let i=0;i<N;i++){
    if (!candidateOk(i,colorMask,fmtBit)) continue;
    let s=0, best=-2, bestP=picks[0];
    for (const p of picks){
      const c=cos(i,p); s+=c;
      if (c>best){best=c;bestP=p;}
    }
    s/=picks.length;
    s += Math.log1p(FREQ[i])*0.012;        /* gentle popularity prior */
    scores.push([s,i,bestP]);
  }
  scores.sort((a,b)=>b[0]-a[0]);
  const top=scores.slice(0,60);
  const max=top.length?top[0][0]:1;
  $("suggest-list").innerHTML = top.map(([s,i,bp],k)=>`
    <div class="row" data-i="${i}">
      <span class="rank">${k+1}</span>
      <span class="name"><a href="${scry(DATA.names[i])}" target="_blank"
          rel="noopener" onclick="event.stopPropagation()">${esc(DATA.names[i])}</a>
        <span class="why">· pairs with ${esc(DATA.names[bp])}</span>
        ${FREQ[i]? "": '<span class="badge">unproven</span>'}</span>
      <span class="bar-track"><span class="bar" style="width:${(100*Math.max(0,s)/max).toFixed(0)}%"></span></span>
      <span class="sc">${s.toFixed(2)}</span>
      <span class="type" style="grid-column: 2 / -1">${esc(DATA.types[i])}</span>
    </div>`).join("");
  document.querySelectorAll("#suggest-list .row").forEach(r=>
    r.onclick=()=>addPick(Number(r.dataset.i)));
}

function renderSearch(){
  const q=$("search").value.trim().toLowerCase();
  if (q.length<2){ $("search-results").innerHTML=""; return; }
  const hits=[];
  for (let i=0;i<N && hits.length<12;i++){
    if (DATA.names[i].toLowerCase().includes(q)) hits.push(i);
  }
  $("search-results").innerHTML = hits.map(i=>`
    <div class="row" data-i="${i}">
      <span class="name">${esc(DATA.names[i])}</span>
      <span class="type">${esc(DATA.types[i])}</span>
    </div>`).join("");
  document.querySelectorAll("#search-results .row").forEach(r=>
    r.onclick=()=>addPick(Number(r.dataset.i)));
}

/* ---- full-deck generation: the neighbors are the recipe ---- */
const K_NEIGHBORS = 25, DECK_SIZE = 60;
let centroids = null;
function deckCentroids(){
  if (centroids) return centroids;
  const D = DATA.decks60.length;
  centroids = new Float32Array(D*DIM);
  for (let d=0; d<D; d++){
    let tot=0;
    const off=d*DIM;
    for (const [row,qty] of DATA.decks60[d].c){
      const o=row*DIM;
      for (let k=0;k<DIM;k++) centroids[off+k]+=V[o+k]/NORM[row]*qty;
      tot+=qty;
    }
    let nrm=0;
    for (let k=0;k<DIM;k++){centroids[off+k]/=tot; nrm+=centroids[off+k]**2;}
    nrm=Math.sqrt(nrm)||1;
    for (let k=0;k<DIM;k++) centroids[off+k]/=nrm;
  }
  return centroids;
}

function buildDeck(){
  if (!picks.length || source==="cmd") return;
  const cents = deckCentroids();
  const seedVec = new Float32Array(DIM);
  for (const p of picks){const o=p*DIM;
    for(let k=0;k<DIM;k++) seedVec[k]+=V[o+k]/NORM[p];}
  let nrm=0; for(let k=0;k<DIM;k++) nrm+=seedVec[k]**2;
  nrm=Math.sqrt(nrm)||1; for(let k=0;k<DIM;k++) seedVec[k]/=nrm;

  const D = DATA.decks60.length;
  const sims = new Float32Array(D);
  for (let d=0;d<D;d++){let s=0;const off=d*DIM;
    for(let k=0;k<DIM;k++) s+=cents[off+k]*seedVec[k];
    sims[d]=s;}
  const order = [...Array(D).keys()].sort((a,b)=>sims[b]-sims[a])
    .slice(0,K_NEIGHBORS);

  const fmtBit = $("format").value ? (1<<DATA.formats.indexOf($("format").value)) : 0;
  let colorMask=0;
  for (const p of picks) colorMask |= (DATA.colors[p] & ~32);
  const inColors = $("incolors").checked;

  const presence=new Map(), qtySum=new Map(), qtyN=new Map(), landPres=new Map();
  const curve=new Float32Array(8);
  const nonlandCounts=[], landCounts=[];
  for (const d of order){
    const w=sims[d], rec=DATA.decks60[d];
    let nl=0, ll=0;
    for (const [row,qty] of rec.c){
      nl+=qty;
      curve[Math.min(7,DATA.mv[row])]+=w*qty;
      presence.set(row,(presence.get(row)||0)+w);
      qtySum.set(row,(qtySum.get(row)||0)+w*qty);
      qtyN.set(row,(qtyN.get(row)||0)+w);
    }
    for (const [row,qty] of rec.l){
      ll+=qty;
      if (!DATA.types[row].includes("Basic"))
        landPres.set(row,(landPres.get(row)||0)+w);
    }
    nonlandCounts.push(nl); landCounts.push(ll);
  }
  nonlandCounts.sort((a,b)=>a-b);
  const nonlandTarget=Math.min(40,nonlandCounts[Math.floor(nonlandCounts.length/2)]||36);
  const landTarget=DECK_SIZE-nonlandTarget;
  let csum=0; for(let b=0;b<8;b++) csum+=curve[b];
  for(let b=0;b<8;b++) curve[b]/=(csum||1);
  let maxPres=0; for (const v of presence.values()) maxPres=Math.max(maxPres,v);

  const okCard=(r)=>{
    if (fmtBit && !(DATA.legal[r] & fmtBit)) return false;
    if (inColors && (DATA.colors[r] & ~32 & ~colorMask)) return false;
    return true;
  };

  const picked=new Map(), curCurve=new Float32Array(8);
  let total=0;
  for (const p of picks){
    if (DATA.colors[p] & 32) continue;
    const q=Math.min(4, nonlandTarget-total);
    picked.set(p,q); curCurve[Math.min(7,DATA.mv[p])]+=q; total+=q;
  }
  const cands=[...presence.keys()].filter(r=>
    !(DATA.colors[r]&32) && !picked.has(r) && okCard(r));
  const syn=new Map(cands.map(r=>[r,cos_vec(r,seedVec)]));
  while (total<nonlandTarget && cands.length){
    let best=-1,bestScore=-1e9,bestIdx=-1;
    for (let ci=0;ci<cands.length;ci++){
      const r=cands[ci];
      let score=2.0*presence.get(r)/maxPres + syn.get(r);
      const b=Math.min(7,DATA.mv[r]);
      const over=(curCurve[b]+2)/Math.max(total+2,1)-curve[b];
      score-=3.0*Math.max(0,over);
      if (score>bestScore){best=r;bestScore=score;bestIdx=ci;}
    }
    if (best<0) break;
    let copies=Math.round(qtySum.get(best)/Math.max(qtyN.get(best),1e-9));
    copies=Math.max(1,Math.min(4,copies,nonlandTarget-total));
    picked.set(best,copies);
    curCurve[Math.min(7,DATA.mv[best])]+=copies;
    total+=copies;
    cands.splice(bestIdx,1);
  }

  /* lands: neighbors' nonbasics, then basics covering every pip color */
  const lands=new Map();
  let landTotal=0;
  for (const [row,_w] of [...landPres.entries()].sort((a,b)=>b[1]-a[1])){
    if (landTotal>=Math.floor(landTarget*0.55)) break;
    if (fmtBit && !(DATA.legal[row] & fmtBit)) continue;
    if (inColors && (DATA.colors[row] & ~32 & ~colorMask)) continue;
    const copies=Math.min(4,landTarget-landTotal);
    lands.set(row,copies); landTotal+=copies;
  }
  const pipCount={};
  for (const [r,q] of picked)
    for (const ch of DATA.pips[r]) pipCount[ch]=(pipCount[ch]||0)+q;
  const colorsUsed=Object.keys(pipCount);
  let remaining=landTarget-landTotal;
  if (colorsUsed.length && remaining>0){
    const totPips=Object.values(pipCount).reduce((a,b)=>a+b,0);
    /* every color gets at least one source */
    const alloc={};
    colorsUsed.forEach(c=>{alloc[c]=1; remaining-=1;});
    colorsUsed.sort((a,b)=>pipCount[b]-pipCount[a]).forEach((c,i)=>{
      const extra=Math.round((landTarget-landTotal-colorsUsed.length)*pipCount[c]/totPips);
      const take=Math.max(0,Math.min(extra,remaining));
      alloc[c]+=take; remaining-=take;
    });
    if (remaining>0) alloc[colorsUsed[0]]+=remaining;
    for (const c of colorsUsed){
      const row=DATA.basics[c];
      if (alloc[c]>0) lands.set(row,(lands.get(row)||0)+alloc[c]);
    }
  }
  renderDeck(picked,lands);
}

function cos_vec(r, vec){
  let s=0; const o=r*DIM;
  for(let k=0;k<DIM;k++) s+=V[o+k]*vec[k];
  return s/NORM[r];
}

function renderDeck(picked,lands){
  const entries=[...picked.entries()].sort((a,b)=>
    (DATA.mv[a[0]]-DATA.mv[b[0]]) || (b[1]-a[1]));
  const landEntries=[...lands.entries()].sort((a,b)=>b[1]-a[1]);
  const total=[...picked.values()].reduce((a,b)=>a+b,0)+
    [...lands.values()].reduce((a,b)=>a+b,0);
  const line=([r,q])=>`<div class="dline"><span class="q">${q}</span>
    <span class="nm"><a href="${scry(DATA.names[r])}" target="_blank" rel="noopener"
      style="color:inherit">${esc(DATA.names[r])}</a></span></div>`;
  const text=[...entries,...landEntries].map(([r,q])=>`${q} ${DATA.names[r]}`).join("\n");
  const out=$("deck-out");
  out.hidden=false;
  out.innerHTML=`<h2>Generated deck <span class="muted">· ${total} cards ·
      built from the ${K_NEIGHBORS} most similar real decks</span></h2>
    <div class="toolbar">
      <button id="copy-deck">Copy decklist</button>
      <button id="dl-deck">Download .txt</button>
      <button id="close-deck">Close</button>
    </div>
    <div class="cols">${entries.map(line).join("")}</div>
    <p class="muted">Lands</p>
    <div class="cols">${landEntries.map(line).join("")}</div>`;
  $("copy-deck").onclick=async()=>{await navigator.clipboard.writeText(text);};
  $("dl-deck").onclick=()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text+"\n"],{type:"text/plain"}));
    a.download="deck.txt"; a.click(); URL.revokeObjectURL(a.href);
  };
  $("close-deck").onclick=()=>{out.hidden=true;};
  out.scrollIntoView({behavior:"smooth",block:"nearest"});
}

$("build").addEventListener("click", buildDeck);

$("search").addEventListener("input", renderSearch);
$("clear").onclick=()=>{picks.length=0;render();};
["format","incolors","proven"].forEach(id=>
  $(id).addEventListener("change", render));
$("source").addEventListener("change", ()=>{
  source = $("source").value;
  V = SPACES[source].vecs; NORM = SPACES[source].norms; FREQ = SPACES[source].freq;
  $("format").style.display = source==="cmd" ? "none" : "";
  $("build").style.display = source==="cmd" ? "none" : "";
  render();
});
render();
</script>
</body>
</html>
