<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Meta Deck Map</title>
<style>
  :root {
    --surface-1: #1a1a19; --surface-2: #242422;
    --text-primary: #ffffff; --text-secondary: #c3c2b7;
    --border: #3c3b36;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface-1); color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; gap: 0.9rem; align-items: center; flex-wrap: wrap;
    padding: 0.55rem 0.9rem;
    background: color-mix(in srgb, var(--surface-1) 88%, transparent);
    border-bottom: 1px solid var(--border); }
  #bar h1 { font-size: 0.95rem; margin: 0 0.4rem 0 0; font-weight: 600; }
  #bar .n { color: var(--text-secondary); font-size: 0.8rem; }
  #bar a { margin-left: auto; color: var(--text-secondary); font-size: 0.83rem; }
  #bar a:hover { color: var(--text-primary); }
  input[type=search], button { background: var(--surface-2); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 0.28rem 0.5rem; font-size: 0.85rem; }
  #legend { position: fixed; right: 0.75rem; top: 3.4rem; z-index: 5;
    background: color-mix(in srgb, var(--surface-1) 90%, transparent);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 0.5rem 0.7rem; }
  #legend .item { display: flex; align-items: center; gap: 0.45rem;
    padding: 0.12rem 0.2rem; cursor: pointer; border-radius: 5px;
    font-size: 0.83rem; color: var(--text-secondary); }
  #legend .item:hover { background: var(--surface-2); }
  #legend .item.active { color: var(--text-primary); font-weight: 600; }
  #legend .sw { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  #legend .count { margin-left: auto; font-size: 0.75rem; padding-left: 0.7rem; }
  #tip { position: fixed; z-index: 6; pointer-events: none; display: none;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 7px; padding: 0.4rem 0.6rem; max-width: 20rem;
    font-size: 0.82rem; box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
  #tip .t { font-weight: 600; color: var(--text-primary); }
  #tip .s { color: var(--text-secondary); }
  #hint { position: fixed; left: 0.75rem; bottom: 0.6rem; z-index: 5;
    color: var(--text-secondary); font-size: 0.75rem; }
  #bar input[type=search] { max-width: 42vw; }
  #bar select { max-width: 44vw; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  #tip { pointer-events: auto; }
  @media (max-width: 640px) {
    #bar { gap: 0.45rem; padding: 0.4rem 0.6rem; }
    #bar h1 { font-size: 0.85rem; }
    #bar input, #bar button { font-size: 16px; padding: 0.3rem 0.5rem; }
    #bar input[type=search] { flex: 1 1 7rem; width: 7rem; }
    #legend { top: auto; bottom: 0.6rem; max-height: 34vh; overflow-y: auto;
      font-size: 0.78rem; max-width: 12rem; padding: 0.4rem 0.5rem; }
    #count { display: none; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="bar">
  <h1>MTG meta deck map</h1>
  <input id="search" type="search" placeholder="highlight decks by card… e.g. bolt" size="26">
  <button id="reset">Reset view</button>
  <span class="n" id="count"></span>
  <a href="deck-seeker.html" style="margin-left:auto">deck seeker →</a>
  <a href="/" style="margin-left:0">card map →</a>
</div>
<div id="legend"></div>
<div id="tip"></div>
<div id="hint">each dot is one tournament deck (qty-weighted mean of its card embeddings) · drag/scroll · hover for the deck · click legend to isolate</div>
<canvas id="c"></canvas>

<script>
const DATA = __DATA__;
const N = DATA.x.length;
const FORMATS = DATA.formats;
const COLORS = {standard:"#3987e5", pioneer:"#199e70", modern:"#e66767",
                legacy:"#9085e9", vintage:"#c98500", pauper:"#008300"};

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");
let isolate = null, highlight = null, view = null;

let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
for (let i=0;i<N;i++){
  if (DATA.x[i]<minX)minX=DATA.x[i]; if (DATA.x[i]>maxX)maxX=DATA.x[i];
  if (DATA.y[i]<minY)minY=DATA.y[i]; if (DATA.y[i]>maxY)maxY=DATA.y[i];
}
function resetView(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  view = { cx:(minX+maxX)/2, cy:(minY+maxY)/2,
           scale: 0.92*Math.min(w/(maxX-minX), h/(maxY-minY)) };
}
const toScreen=(x,y)=>[(x-view.cx)*view.scale+canvas.clientWidth/2,
                       (y-view.cy)*view.scale+canvas.clientHeight/2];

function resize(){
  /* CSS (100vw/100vh) owns the element size so it always tracks the real
     layout viewport; JS only syncs the backing store. Setting an explicit
     px width from innerWidth here used to freeze a pre-viewport value on
     mobile and blow the page up to device-pixel width. */
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (!view || !userAdjusted) resetView();
  draw();
}
new ResizeObserver(()=>resize()).observe(canvas);

function draw(){
  ctx.fillStyle="#1a1a19";
  ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);
  const r = Math.max(1.6, Math.min(3.2, view.scale*0.05));
  for (let pass=0; pass<2; pass++){
    for (let i=0;i<N;i++){
      const fmt = FORMATS[DATA.f[i]];
      const dim = !!((isolate!==null && DATA.f[i]!==isolate) ||
                     (highlight && !highlight.has(i)));
      if ((pass===0) !== dim) continue;
      const [sx,sy]=toScreen(DATA.x[i],DATA.y[i]);
      if (sx<-4||sy<-4||sx>canvas.clientWidth+4||sy>canvas.clientHeight+4) continue;
      ctx.globalAlpha = dim?0.06:0.85;
      ctx.fillStyle = COLORS[fmt];
      ctx.beginPath(); ctx.arc(sx,sy,dim?r*0.8:r,0,6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

function buildLegend(){
  const counts = new Array(FORMATS.length).fill(0);
  DATA.f.forEach(v=>counts[v]++);
  const el = document.getElementById("legend");
  el.innerHTML = FORMATS.map((fmt,i)=>`
    <div class="item${isolate===i?" active":""}" data-i="${i}">
      <span class="sw" style="background:${COLORS[fmt]}"></span>
      ${fmt}<span class="count">${counts[i].toLocaleString()}</span>
    </div>`).join("");
  el.querySelectorAll(".item").forEach(item=>{
    item.onclick=()=>{ const i=Number(item.dataset.i);
      isolate=(isolate===i)?null:i; buildLegend(); draw(); };
  });
}

let dragging=false,lastX=0,lastY=0,moved=0;
const pointers=new Map();
let pinchDist=0;
let userAdjusted=false;
function zoomAt(mx,my,k){
  userAdjusted=true;
  const wx=(mx-canvas.clientWidth/2)/view.scale+view.cx;
  const wy=(my-canvas.clientHeight/2)/view.scale+view.cy;
  view.scale*=k;
  view.cx=wx-(mx-canvas.clientWidth/2)/view.scale;
  view.cy=wy-(my-canvas.clientHeight/2)/view.scale;
  draw();
}
canvas.addEventListener("pointerdown",e=>{
  pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if (pointers.size===1){
    dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
    canvas.style.cursor="grabbing";
  } else {
    dragging=false;
    const p=[...pointers.values()];
    pinchDist=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
  }
});
addEventListener("pointerup",e=>{
  if (pointers.size===1 && dragging && moved<6 && e.target===canvas
      && e.pointerType==="touch"){
    hover(e.clientX, e.clientY);      /* tap shows the deck tooltip */
  }
  pointers.delete(e.pointerId);
  if (!pointers.size){dragging=false;pinchDist=0;canvas.style.cursor="grab";}
});
addEventListener("pointercancel",e=>{
  pointers.delete(e.pointerId);
  if (!pointers.size){dragging=false;pinchDist=0;}
});
addEventListener("pointermove",e=>{
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if (pointers.size===2){
    const p=[...pointers.values()];
    const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    if (pinchDist>0 && d>0)
      zoomAt((p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2,d/pinchDist);
    pinchDist=d;
    return;
  }
  if (dragging){
    userAdjusted=true;
    moved+=Math.abs(e.clientX-lastX)+Math.abs(e.clientY-lastY);
    view.cx-=(e.clientX-lastX)/view.scale; view.cy-=(e.clientY-lastY)/view.scale;
    lastX=e.clientX; lastY=e.clientY; draw();
  } else if (e.pointerType!=="touch") hover(e.clientX,e.clientY);
});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0016));
},{passive:false});

function nearest(px,py,radius){
  let best=-1,bestD=radius*radius;
  for (let i=0;i<N;i++){
    if (isolate!==null && DATA.f[i]!==isolate) continue;
    if (highlight && !highlight.has(i)) continue;
    const [sx,sy]=toScreen(DATA.x[i],DATA.y[i]);
    const d=(sx-px)*(sx-px)+(sy-py)*(sy-py);
    if (d<bestD){bestD=d;best=i;}
  }
  return best;
}
function hover(px,py){
  const i=nearest(px,py,10);
  if (i<0){tip.style.display="none";return;}
  tip.innerHTML=`<div class="t">${FORMATS[DATA.f[i]]} — ${DATA.p[i]}</div>`+
    `<div class="s">${DATA.top[i].join(", ")}</div>`+
    `<div class="s">${DATA.e[i]} · ${DATA.d[i]}</div>`;
  tip.style.display="block";
  tip.style.left=Math.min(px+14,innerWidth-330)+"px";
  tip.style.top=Math.min(py+14,innerHeight-100)+"px";
}

document.getElementById("reset").onclick=()=>{userAdjusted=false;resetView();draw();};
document.getElementById("search").oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  if (!q){highlight=null;}
  else {
    highlight=new Set();
    for (let i=0;i<N;i++){
      if (DATA.top[i].some(c=>c.toLowerCase().includes(q)) ||
          DATA.p[i].toLowerCase().includes(q)) highlight.add(i);
    }
  }
  draw();
};

document.getElementById("count").textContent =
  N.toLocaleString()+" tournament decks · mtgo.com results · UMAP of deck vectors";
addEventListener("resize",resize);
resize(); buildLegend();
</script>
</body>
</html>
