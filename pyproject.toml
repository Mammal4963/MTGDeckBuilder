[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-deckbuilder"
version = "0.1.0"
description = "Find the decks hiding in your Magic: The Gathering collection - keyword extraction, synergy grouping, and automatic deck tuning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mtgdeck = "mtg_deckbuilder.cli:main"

[tool.setuptools.packages.find]
include = ["mtg_deckbuilder*"]
